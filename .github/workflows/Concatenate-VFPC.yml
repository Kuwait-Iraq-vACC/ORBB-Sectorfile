name: VFPC Data File Compiler
on:
  push:
    branches:
      - main
    paths:
      - '.data/VFPC/**'
      - '.github/workflows/Concatenate-VFPC.yml'
      - '.github/scripts/VFPC/Concatenate-VFPC.py'
concurrency:
  group: VFPC-Compile
  cancel-in-progress: true
jobs:
  compile:
    name: Compile VFPC Data Files
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # App token: its pushes bypass the AIRAC Gate ruleset on main and, unlike
      # GITHUB_TOKEN, trigger the AIRAC Gate on PR branches
      - name: Generate GitHub token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: generate-token
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ steps.generate-token.outputs.token }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run compiler
        run: python .github/scripts/VFPC/Concatenate-VFPC.py
      - name: Commit compiled files
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add ORBB/Plugins/VFPC/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Compile VFPC data files | ${{ github.event.head_commit.message }}
            Co-authored-by: ${{ github.event.head_commit.author.name }} <${{ github.event.head_commit.author.email }}>"
            git pull --rebase
            git push
          fi